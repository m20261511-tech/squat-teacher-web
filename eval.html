<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스쿼트 포즈 평가</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@latest/dist/image.min.js"></script>
  <style>
    :root {
      --bg: #f6fbff;
      --panel: #ffffff;
      --line: #dfeaf7;
      --text: #1f2d3d;
      --muted: #5b6f83;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #f59e0b;
      --shadow: 0 14px 30px rgba(37, 99, 235, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(180deg, #edf6ff 0%, #f8fbff 100%);
      color: var(--text);
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 18px 40px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 22px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 3vw, 2.8rem);
      color: #1d4d8f;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
    }
    input[type="file"] {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }
    button {
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      padding: 10px 18px;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #e2e8f0;
      color: var(--text);
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 22px;
    }
    .stat {
      background: #f8fbff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .stat-label {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 6px;
    }
    .stat-value {
      font-weight: 800;
      font-size: 1.7rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 22px;
      margin-top: 22px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.96rem;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 10px 8px;
      text-align: center;
    }
    th {
      background: #f4f8ff;
    }
    .errors {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }
    .error-item {
      display: grid;
      grid-template-columns: 100px 1fr 1fr 1fr 1fr;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 10px;
      align-items: center;
    }
    .thumb {
      width: 100px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #f6faff;
    }
    .status {
      margin-top: 14px;
      color: var(--muted);
      min-height: 24px;
    }
    .good {
      color: var(--success);
      font-weight: 700;
    }
    .bad {
      color: var(--danger);
      font-weight: 700;
    }
    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .error-item {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>스쿼트 포즈 평가 도구</h1>

      <div class="toolbar">
        <!-- 여러 장을 한 번에 선택 -->
        <input id="fileInput" type="file" accept="image/*" multiple />
        <button id="runBtn">평가 시작</button>
        <button id="downloadBtn" class="secondary" disabled>CSV 내려받기</button>
      </div>

      <div id="status" class="status">이미지 파일을 선택해 주세요.</div>

      <div class="summary">
        <div class="stat">
          <div class="stat-label">총 사진 수</div>
          <div id="totalCount" class="stat-value">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">정답 수</div>
          <div id="correctCount" class="stat-value">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">오답 수</div>
          <div id="errorCount" class="stat-value">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">전체 정확도</div>
          <div id="accuracyRate" class="stat-value">0%</div>
        </div>
      </div>

      <div class="grid">
        <div>
          <h3>혼동행렬</h3>
          <div id="confusionMatrixWrap"></div>
        </div>
        <div>
          <h3>클래스별 정분류율</h3>
          <div id="accuracyByClassWrap"></div>
        </div>
      </div>

      <div style="margin-top: 28px;">
        <h3>틀린 사진 모음</h3>
        <div id="errorList" class="errors"></div>
      </div>
    </div>
  </div>

  <script>
    // pose 모델은 tmImage가 아니라 tmPose를 사용한다.
    // 같은 폴더에 있는 model.json, metadata.json을 로드한다.
    const MODEL_URL = "./model.json";
    const METADATA_URL = "./metadata.json";

    let model = null;
    let labels = [];
    let rawResults = [];
    let allResults = [];

    // 파일 이름에서 '_' 앞부분을 실제 클래스 라벨로 사용한다.
    // 예: "can_01.jpg" => "can"
    function getClassFromFilename(fileName) {
      const base = fileName.replace(/\.[^/.]+$/, "");
      return base.split("_")[0];
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 혼동행렬 생성
    function buildConfusionMatrix(actualLabels, predictedLabels) {
      const unique = [...new Set(actualLabels.concat(predictedLabels))].sort();
      const indexMap = {};
      unique.forEach((label, idx) => indexMap[label] = idx);

      const matrix = Array.from({ length: unique.length }, () =>
        Array(unique.length).fill(0)
      );

      actualLabels.forEach((actual, i) => {
        const a = indexMap[actual];
        const p = indexMap[predictedLabels[i]];
        if (Number.isInteger(a) && Number.isInteger(p)) {
          matrix[a][p] += 1;
        }
      });

      return { labels: unique, matrix };
    }

    // 클래스별 정분류율 계산
    function calcAccuracyByClass(actualLabels, predictedLabels, uniqueClasses) {
      const stats = [];

      uniqueClasses.forEach((cls) => {
        const actualIdxs = actualLabels.map((label, i) => label === cls ? i : -1).filter(i => i >= 0);
        const correct = actualIdxs.filter(i => predictedLabels[i] === cls).length;
        const total = actualIdxs.length || 0;
        const rate = total === 0 ? 0 : (correct / total) * 100;

        stats.push({
          className: cls,
          correct,
          total,
          rate
        });
      });

      return stats;
    }

    // 혼동행렬 HTML 생성
    function renderConfusionMatrix(matrixData) {
      const { labels, matrix } = matrixData;

      let html = `
        <table>
          <thead>
            <tr>
              <th>실제\\예측</th>
      `;

      labels.forEach(label => {
        html += `<th>${escapeHtml(label)}</th>`;
      });

      html += `</tr></thead><tbody>`;

      labels.forEach((rowLabel, rIdx) => {
        html += `<tr><th>${escapeHtml(rowLabel)}</th>`;
        matrix[rIdx].forEach((value, cIdx) => {
          html += `<td>${value}</td>`;
        });
        html += `</tr>`;
      });

      html += `</tbody></table>`;
      document.getElementById("confusionMatrixWrap").innerHTML = html;
    }

    // 클래스별 정분류율 HTML 생성
    function renderAccuracyByClass(stats) {
      let html = `
        <table>
          <thead>
            <tr>
              <th>클래스</th>
              <th>정분류 수</th>
              <th>전체</th>
              <th>정분류율</th>
            </tr>
          </thead>
          <tbody>
      `;

      stats.forEach(item => {
        html += `
          <tr>
            <td>${escapeHtml(item.className)}</td>
            <td>${item.correct}</td>
            <td>${item.total}</td>
            <td>${(item.rate).toFixed(1)}%</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      document.getElementById("accuracyByClassWrap").innerHTML = html;
    }

    function renderErrorList(errors) {
      const wrap = document.getElementById("errorList");
      if (!errors.length) {
        wrap.innerHTML = '<div class="good">틀린 사진이 없습니다.</div>';
        return;
      }

      wrap.innerHTML = "";
      errors.forEach(item => {
        const div = document.createElement("div");
        div.className = "error-item";

        div.innerHTML = `
          <img class="thumb" src="${item.previewUrl}" alt="${escapeHtml(item.filename)}" />
          <div><strong>파일명</strong><br>${escapeHtml(item.filename)}</div>
          <div><strong>실제</strong><br>${escapeHtml(item.actual)}</div>
          <div><strong>예측</strong><br>${escapeHtml(item.predicted)}</div>
          <div><strong>확률</strong><br>${(item.confidence * 100).toFixed(1)}%</div>
        `;
        wrap.appendChild(div);
      });
    }

    function updateSummary(actualLabels, predictedLabels) {
      const total = actualLabels.length;
      const correct = actualLabels.filter((label, idx) => label === predictedLabels[idx]).length;
      const wrong = total - correct;
      const rate = total ? (correct / total) * 100 : 0;

      document.getElementById("totalCount").textContent = total;
      document.getElementById("correctCount").textContent = correct;
      document.getElementById("errorCount").textContent = wrong;
      document.getElementById("accuracyRate").textContent = `${rate.toFixed(1)}%`;
    }

    function downloadCSV() {
      if (!allResults.length) return;

      const header = ["filename", "actual", "predicted", "isCorrect", "confidence"];
      const rows = allResults.map(r => [
        r.filename,
        r.actual,
        r.predicted,
        r.isCorrect ? "true" : "false",
        r.confidence.toFixed(6)
      ]);

      const csvContent = [header, ...rows]
        .map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(","))
        .join("\n");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "evaluation_result.csv";
      a.click();

      URL.revokeObjectURL(url);
    }

    async function loadModel() {
      // 브라우저 내부에서만 처리. 외부 서버로 사진을 보낼 수 없음.
      // 이 페이지는 로컬 파일 선택만 사용한다.
      const status = document.getElementById("status");
      try {
        status.innerHTML = "모델 로딩 중...";
        model = await tmPose.load(MODEL_URL, METADATA_URL);
        labels = model.getClassLabels ? model.getClassLabels() : [];
        status.innerHTML = '<span class="good">모델 로딩 완료</span>';
      } catch (error) {
        status.innerHTML = '<span class="bad">모델 로딩 실패: ' + error.message + '</span>';
        console.error(error);
      }
    }

    async function processFiles(fileList) {
      if (!fileList || !fileList.length) {
        document.getElementById("status").innerHTML = '<span class="bad">사진이 선택되지 않았습니다.</span>';
        return;
      }

      if (!model) {
        await loadModel();
      }

      if (!model) {
        document.getElementById("status").innerHTML = '<span class="bad">모델이 준비되지 않았습니다.</span>';
        return;
      }

      const files = Array.from(fileList).sort((a, b) => a.name.localeCompare(b.name));
      const predictions = [];
      const actualLabels = [];
      const errorItems = [];
      const resultRows = [];

      document.getElementById("status").innerHTML = `처리 중... (${files.length}장)`;

      for (const file of files) {
        const actual = getClassFromFilename(file.name);
        const previewUrl = URL.createObjectURL(file);

        // 실제 이미지 로딩
        const img = new Image();
        img.src = previewUrl;
        await img.decode();

        // pose 모델은 이미지에서 포즈를 추정 후, 포즈 특징을 기반으로 분류한다.
        const { pose, posenetOutput } = await model.estimatePose(img);

        // 포즈 추정 결과를 기반으로 클래스 예측
        const predList = await model.predict(posenetOutput);

        // 가장 높은 확률 클래스 선택
        const best = predList.reduce((a, b) => a.probability > b.probability ? a : b);
        const predictedLabel = best.className;
        const confidence = Number(best.probability);

        actualLabels.push(actual);
        predictions.push(predictedLabel);

        const isCorrect = actual === predictedLabel;

        resultRows.push({
          filename: file.name,
          actual,
          predicted: predictedLabel,
          isCorrect,
          confidence
        });

        // 틀린 사진만 보관
        if (!isCorrect) {
          errorItems.push({
            filename: file.name,
            actual,
            predicted: predictedLabel,
            confidence,
            previewUrl
          });
        }
      }

      allResults = resultRows;
      updateSummary(actualLabels, predictions);

      const matrixData = buildConfusionMatrix(actualLabels, predictions);
      renderConfusionMatrix(matrixData);

      const classes = [...new Set(actualLabels.concat(predictions))].sort();
      const classStats = calcAccuracyByClass(actualLabels, predictions, classes);
      renderAccuracyByClass(classStats);

      renderErrorList(errorItems);

      const total = actualLabels.length;
      const correct = actualLabels.filter((label, idx) => label === predictions[idx]).length;
      const accuracy = total ? (correct / total) * 100 : 0;

      document.getElementById("status").innerHTML =
        `<span class="good">평가 완료</span> — ${correct}/${total} 정답, 정확도 ${accuracy.toFixed(1)}%`;

      document.getElementById("downloadBtn").disabled = false;
    }

    document.getElementById("fileInput").addEventListener("change", (event) => {
      processFiles(event.target.files);
    });

    document.getElementById("runBtn").addEventListener("click", () => {
      const fileInput = document.getElementById("fileInput");
      if (fileInput.files && fileInput.files.length) {
        processFiles(fileInput.files);
      } else {
        document.getElementById("status").innerHTML = '<span class="bad">먼저 이미지 파일을 선택해 주세요.</span>';
      }
    });

    document.getElementById("downloadBtn").addEventListener("click", downloadCSV);

    // 페이지 로드시 모델을 준비
    loadModel();
  </script>
</body>
</html>
