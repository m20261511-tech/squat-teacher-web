<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이미지 분류 평가 도구</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #dfe6ee;
      --text: #1d2430;
      --muted: #607089;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #f59e0b;
      --shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 20px 40px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px;
      margin-top: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .file-picker {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    input[type="file"] {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      max-width: 100%;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button.primary {
      background: var(--primary);
      color: white;
    }

    button.primary:hover {
      filter: brightness(1.04);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      overflow: hidden;
      border-radius: 12px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 10px 8px;
      text-align: center;
      font-size: 0.92rem;
    }

    th {
      background: #f3f6fb;
    }

    .accuracy-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    .accuracy-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafcff;
    }

    .accuracy-name {
      font-weight: 600;
    }

    .accuracy-value {
      color: var(--primary);
      font-weight: 700;
    }

    .wrong-list {
      margin-top: 10px;
      display: grid;
      gap: 10px;
    }

    .wrong-item {
      border: 1px solid #f1d5d5;
      background: #fff7f7;
      border-radius: 10px;
      padding: 10px 12px;
    }

    .wrong-item strong {
      color: var(--danger);
    }

    .wrong-item .meta {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 4px;
    }
